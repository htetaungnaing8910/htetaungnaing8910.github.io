<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operator</title>
</head>
<body>
<script>
//assign operator =
let name = "Kyaw Zin Aung";
console.log(name)

//addition operator +
let number = 365456898 + 4589845980;
console.log(number);
let fiveFour = '5' + 4
console.log(fiveFour);
let no = 7;
console.log(no); //7
//no = no + 3
no += 3
console.log(no); //10
let num = 5;

console.log(num++); //5
console.log(num); //6
console.log(++num);

//substraction operator -
let sub = 10 - 5;
let num1 = 4;
let result = sub - num1;
console.log(sub);
console.log(result);

//mutiplication operator *
let multi = 5 * 5;
console.log(multi);
multi *= 5; //multi = multi * 5;
console.log(multi);

//division operator/
let div = 10 / 2;
console.log(div);

//remainder operation %
let remainder= 10 % 3;
console.log(remainder)

//exponent operator **
let exponent= 2 ** 5
console.log(exponent)


</script>
</body>
</html>
