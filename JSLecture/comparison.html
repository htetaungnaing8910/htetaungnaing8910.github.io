<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparison Lesson</title>
</head>
<body>
<h1>Comparison Lessons</h1>
<script>
//greather than >
let a = 10;
let b = '10';

console.log(a>b); //true/false

// greather than equal >=
console.log(a>= b); // true/false

// less than < 
console.log(a < b);

//less than equal <=
console.log(a <= b);

// equal == value
console.log(a==b);

// triple equal === datatype & value
console.log (a === b);

// not equal !=
console.log(a != b)

//not double equal !== datatype & value
console.log(a !== b)

</script>
</body>
</html>
