<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Variables</h1>

    <script>
        
        // တစ်ယောက်ပြီးတစ်ယောက်တွဲ
        // global variable (var)
        var name = "Kyaw Zin Aung";
        name = "Kyaw Gyi";
        console.log(name);


        // တစ်ယောက်နဲ့ အတည်တွဲ. ပျက်သွားမှ နောက်တစ်ယောက်တွဲ
        // block scope variable (let)
        let fatherName = "U Maung Nyo";
        fatherName = "U Maung Nyo Update";
        console.log(fatherName);


        // တစ်ယောက်ဆိုတစ်ယောက် ပန်းတောက်ဆိုပန်းတောက်
        // const variable (const)
        const motherName = "Daw Kyin Ohn";
        console.log(motherName);

    </script>
</body>
</html>
