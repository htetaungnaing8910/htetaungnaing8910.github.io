<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="all">
  <form class="main">
      <div class="title">
        <h1 class="welcome">Welcome Back!</h1>
        <p>Please login to your account</p>
      </div>
      <div class="coMain">
        <div class="inputEmail">
          <label for="email">Email Address</label><br>
          <input type="email" id="email" placeholder="Enter your email" class="email">
        </div>
        <div class="inputPassword">
          <label for="password">Password</label><br>
          <input type="password" id="password" placeholder="Enter your password" class="password">
        </div>
        <div class="rememberMe">
          <input type="checkbox">
          <label for="remeberme">Remember me</label>
          <a href="" class="resetPassword">Forgot Password?</a>
        </div>
        <button type="submit" class="login">Login</button>
        <p class="newAccount">Don't have an account?<span ><a href="">Sign Up</a></span></p>
      </div>
  </form>
</body>
</html>
